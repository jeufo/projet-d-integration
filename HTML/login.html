<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion et Inscription</title>
    <link rel="stylesheet" href="../css/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="container">
        <!-- Sign Up Form -->
        <div class="form-container" id="signup-container">
            <h1>Créer un Compte</h1>
            <form id="signup-form">
                <div class="input-container">
                    <i class="fa fa-user icon"></i>
                    <input type="text" placeholder="Nom d'utilisateur" id="signup-username" name="username" required>
                </div>

                <div class="input-container">
                    <i class="fa fa-envelope icon"></i>
                    <input type="email" placeholder="Email" id="signup-email" name="email" required>
                </div>

                <div class="input-container">
                    <i class="fa fa-lock icon"></i>
                    <input type="password" placeholder="Mot de passe" id="signup-password" name="password" required>
                </div>

                <label for="signup-role">Rôle :</label>
                <select id="signup-role" name="role" required>
                    <option value="member">Membre</option>
                    <option value="admin">Administrateur</option>
                </select>

                <button type="submit">Créer le Compte</button>
                <p class="toggle-form" id="show-login">Déjà un compte ? <a href="logins.html">Connectez-vous ici</a> </p>
            </form>
        </div>
    </div>

    <script src="../js/login.js"></script>
</body>
</html>
