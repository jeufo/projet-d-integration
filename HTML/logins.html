<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Se connecter</title>
    <link rel="stylesheet" href="../CSS/login.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>
<body>
    <div class="container">
        <div>
            <img class="image_Container_Connexion" src="../images/image_Page_Connexion/ImageConnexion.png" alt="">
        </div>
        <!-- Login Form -->
        <div class="container_Principale">
            <h1>Connexion</h1>
            <div class="form-container" id="login-container">
                <img src="../images/image_Page_Connexion/image_Formulaire_connexion.png" alt="">
                <form id="login-form">
    <div class="input-container">
        <i class="fa fa-envelope icon"></i>
        <input type="email" placeholder="Email" id="login-email" name="email" required>
    </div>
    <div class="input-container">
        <i class="fa fa-lock icon"></i>
        <input type="password" placeholder="Mot de passe" id="login-password" name="password" required>
    </div>
    <button type="submit" id="">Se connecter</button>
      <div class="social-login">
                    
    <a href="https://www.facebook.com" class="btn facebook"><i class="fa-brands fa-facebook"></i></a>
     <a href="https://accounts.google.com/" class="btn google"><i class="fa-brands fa-google"></i></a>
     <a href="https://www.twitter.com" class="btn twitter"><i class="fa-brands fa-twitter"></i></a>
    </div>
    <p class="toggle-form" id="show-signup">Pas encore de compte ? <a href="login.html">Inscrivez-vous ici</a></p>

</form>

            </div>
        </div>
    </div>
    <script src="../js/logins.js"></script>
</body>
</html>
